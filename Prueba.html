<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lectura de Texto</title>
</head>
<body>

    <p id="texto-a-leer">Hola, esta es una prueba de lectura de texto en pantalla utilizando JavaScript.</p>
    
    <button onmouseover="leerTexto()">Leer Texto</button>
    <button onclick="detenerLectura()">Detener</button>

    <script>
        function leerTexto() {
            // 1. Obtener el texto del elemento DOM
            const texto = document.getElementById('texto-a-leer').innerText;
            
            // 2. Crear una instancia de SpeechSynthesisUtterance
            const mensaje = new SpeechSynthesisUtterance(texto);
            
            // 3. Configurar idioma
            mensaje.lang = 'es-ES';
            
            // 4. Utilizar el motor de síntesis de voz
            window.speechSynthesis.speak(mensaje);
        }

        function detenerLectura() {
            // Cancelar cualquier lectura en curso
            window.speechSynthesis.cancel();
        }
    </script>
</body>
</html>
