<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú Dulcería</title>
<link rel="stylesheet" href="styles2.css">
</head>

<body>

<!-- HEADER FULL WIDTH -->
<header class="header">

<div class="header-content">

    <div class="header-left col-1">
        <img class="logo-hormiga" src="Dulcería imgns/OLA.png" width="64px"> </img>
    </div>

    <div class="header-right col-1">
        <img class="logo-hormiga" src="Dulcería imgns/Cineteca Nacional ngt.png" width="146px" height="52px"> </img>
    </div>

</div>

</header>

<!-- NAV SECCIONES -->
    <nav class="nav-secciones">

        <button class="nav-btn"><img class="icono" src="Botones/Positivo/Alimentos btn.png" alt="Alimentos"> Alimentos</button>
        <button class="nav-btn"><img class="icono" src="Botones/Positivo/Bebidas btn.png" alt="Bebidas"> Bebidas</button>
        <button class="nav-btn"><img class="icono" src="Botones/Positivo/Combos btn.png" alt="Alimentos"> Combos</button>
        <button class="nav-btn"><img class="icono" src="Botones/Positivo/Carrito btn.png" alt="Alimentos">Carrito</button>

    </nav>
<div class="container">

<!-- Barra de categorias -->
    <!-- Categorias -->
    <div class="categorias">

        <button class="cat-btn active" data-cat="palomitas">Palomitas</button>
        <button class="cat-btn active" data-cat="papas">Papas</button>
        <button class="cat-btn active" data-cat="dulces">Dulces</button>
        <button class="cat-btn active" data-cat="galletas">Galletas</button>
        <button class="cat-btn active" data-cat="chocolates">Chocolates</button>
        <button class="cat-btn active" data-cat="cacahuates">Cacahuates</button>

    </div>

    <div class="Instruccion">

    <p>Elige y modifica tus palomitas</p>

    </div>
<!-- GRID PRODUCTOS -->
<main class="productos">

    <!-- Palomitas -->
    <div class="producto" data-cat="palomitas">
        <div class="producto-img">
            <img src="Dulcería imgns/Alimentos/Palomitas mantequilla.png" width="120">
        </div>
        <p class="producto-nombre">Palomitas Mantequilla</p>
        <button class="btn-seleccionar">Modificar</button>
    </div>

    <div class="producto" data-cat="palomitas">
        <div class="producto-img">
            <img src="Dulcería imgns/Alimentos/Palomitas caramelo.png" width="120">
        </div>
        <p class="producto-nombre">Palomitas Caramelo</p>
        <button class="btn-seleccionar">Modificar</button>
    </div>

    <div class="producto" data-cat="palomitas">
        <div class="producto-img">
            <img src="Dulcería imgns/Alimentos/Palomitas Combinadas.png" width="120">
        </div>
        <p class="producto-nombre">Palomitas Combinadas</p>
        <p class="producto-precio">$31</p>

        <button class="btn-seleccionar">Modificar</button>
    </div>

<!-- Papas -->
    <div class="producto" data-cat="papas">
        <div class="producto-img">
            <img src="Dulcería imgns/Alimentos/Papas en vaso.png" width="120">
        </div>
        <p class="producto-nombre">Papas en vaso</p>
        <p class="producto-precio">$31</p>
        <!--Contador-->
        <div class="contador">
        <button class="btn-restar">-</button>
        <span class="cantidad">0</span>
        <button class="btn-sumar">+</button>
    </div>
        <button class="btn-agregar">Agregar</button>
    </div>

    <div class="producto" data-cat="papas">
        <div class="producto-img">
            <img src="Dulcería imgns/Alimentos/Platanos.png" width="120">
        </div>
        <p class="producto-nombre">Plátanos fritos</p>
        
        <!--Contador-->
        <div class="contador">
        <button class="btn-restar">-</button>
        <span class="cantidad">0</span>
        <button class="btn-sumar">+</button>
    </div>
        <button class="btn-agregar">Agregar</button>
    </div>


<!--Dulces-->

    <div class="producto" data-cat="dulces">

            <img src="Dulcería imgns/Dulces/Moritas.png" width="120">

    <!-- Contador -->
    <div class="contador">
        <button class="btn-restar">-</button>
        <span class="cantidad">0</span>
        <button class="btn-sumar">+</button>
    </div>

        <button class="btn-agregar">Agregar</button>
    </div>

    <div class="producto" data-cat="dulces">
        <div class="producto-img">
            <img src="Dulcería imgns/Dulces/Pasas Lapose.png" width="120">

        <p class="producto-nombre">Dulcigomas</p>
        <button class="btn-agregar">Agregar</button>

    <div class="producto" data-cat="dulces">

    <div class="producto" data-cat="dulces">

        </div>
        <p class="producto-nombre">Paleta payaso</p>
        <button class="btn-agregar">Agregar</button>
    </div>

    <div class="producto" data-cat="dulces">

            <img src="Dulcería imgns/Dulces/Almendras.png" width="120">
        </div>
        <p class="producto-nombre">Almendras</p>
        <button class="btn-agregar">Agregar</button>
    </div>

    <div class="producto" data-cat="dulces">
        <div class="producto-img">
            <img src="Dulcería imgns/Dulces/Chocoretas.png" width="120">
        </div>
        <p class="producto-nombre">Chocoretas</p>
        <button class="btn-agregar">Agregar</button>
    </div>

    <div class="producto" data-cat="dulces">
        <div class="producto-img">
            <img src="Dulcería imgns/Dulces/Kranky.png" width="120">
        </div>
        <p class="producto-nombre">Kranky</p>
        <button class="btn-agregar">Agregar</button>
    </div>

    <div class="producto" data-cat="dulces">
        <div class="producto-img">
            <img src="Dulcería imgns/Dulces/Bubulubu.png" width="120">
        </div>
        <p class="producto-nombre">Bubulubu</p>
        <button class="btn-agregar">Agregar</button>
    </div>

    <!--Galletas-->

    <div class="producto" data-cat="galletas">
        <div class="producto-img">
            <img src="Dulcería imgns/Galletas/Chokis.png" width="120">
        </div>
        <p class="producto-nombre">Chokis</p>
        <button class="btn-agregar">Agregar</button>
    </div>

    <div class="producto" data-cat="galletas">
